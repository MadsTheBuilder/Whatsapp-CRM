<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FourthspaceOS — Agent Inbox</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #1d1d1f;
        background: #f5f5f7;
        display: flex;
        height: 100vh;
      }
      #list {
        width: 280px;
        border-right: 1px solid #e0e0e5;
        overflow-y: auto;
        background: #fff;
      }
      #list h1 { font-size: 15px; padding: 16px; margin: 0; border-bottom: 1px solid #eee; }
      .thread { padding: 12px 16px; border-bottom: 1px solid #f0f0f2; cursor: pointer; }
      .thread:hover { background: #f5f5f7; }
      .thread.active { background: #e8f0fe; }
      .thread .name { font-weight: 600; }
      .thread .phone { color: #86868b; font-size: 13px; }
      .thread .stage { font-size: 11px; color: #0071e3; text-transform: uppercase; }
      .badge { display: inline-block; margin-top: 4px; font-size: 11px; font-weight: 600;
        padding: 2px 7px; border-radius: 8px; }
      .badge.active { background: #e6f4ea; color: #1a7a3c; }
      .badge.awaiting { background: #fff4e0; color: #a15c00; }
      .badge.no-reply { background: #ffe5e5; color: #d70015; }
      #memory { padding: 12px 16px; background: #fbfbfd; border-bottom: 1px solid #e0e0e5; }
      #memory h3 { font-size: 11px; color: #86868b; text-transform: uppercase; margin: 0 0 6px; }
      #memory .summary { margin: 0 0 8px; font-size: 13px; color: #3a3a3c; }
      #memory .facts { margin: 0; padding-left: 18px; font-size: 13px; color: #3a3a3c; }
      #detail { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
      #fields { padding: 16px; background: #fff; border-bottom: 1px solid #e0e0e5; }
      .field { display: inline-block; margin-right: 20px; }
      .field .k { font-size: 11px; color: #86868b; text-transform: uppercase; }
      .field .v { font-weight: 600; }
      .field .v.missing { color: #d70015; font-weight: 400; font-style: italic; }
      #next-q { margin-top: 10px; font-size: 13px; color: #6e6e73; }
      #messages { flex: 1; overflow-y: auto; padding: 16px; }
      .msg { max-width: 70%; padding: 8px 12px; border-radius: 12px; margin-bottom: 8px; white-space: pre-wrap; }
      .msg.in { background: #fff; border: 1px solid #e0e0e5; }
      .msg.out { background: #0071e3; color: #fff; margin-left: auto; }
      #replies { padding: 12px 16px; background: #fff; border-top: 1px solid #e0e0e5; }
      #replies h3 { font-size: 11px; color: #86868b; text-transform: uppercase; margin: 0 0 8px; }
      .reply { display: block; width: 100%; text-align: left; padding: 10px 12px; margin-bottom: 6px;
        border: 1px solid #d2d2d7; border-radius: 10px; background: #fff; cursor: pointer; font: inherit; }
      .reply:hover { border-color: #0071e3; background: #f5faff; }
      #custom { display: flex; gap: 8px; margin-top: 8px; }
      #custom input { flex: 1; padding: 10px 12px; border: 1px solid #d2d2d7; border-radius: 10px; font: inherit; }
      #custom button { padding: 10px 16px; border: none; border-radius: 10px; background: #0071e3; color: #fff; cursor: pointer; }
      #empty { margin: auto; color: #86868b; }
    </style>
  </head>
  <body>
    <div id="list"><h1>Conversations</h1></div>
    <div id="detail"><div id="empty">Select a conversation</div></div>
    <script src="inbox.js"></script>
  </body>
</html>
