<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FourthspaceOS — Property Search</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #1d1d1f;
        background: #f5f5f7;
      }
      header { background: #fff; border-bottom: 1px solid #e0e0e5; padding: 14px 24px; display: flex; align-items: baseline; gap: 12px; }
      header h1 { font-size: 18px; margin: 0; color: #e4002b; }
      header .pulled { font-size: 12px; color: #86868b; margin-left: auto; }
      #filters { display: flex; flex-wrap: wrap; gap: 10px; padding: 16px 24px; background: #fff; border-bottom: 1px solid #e0e0e5; align-items: end; }
      #filters label { font-size: 12px; color: #86868b; display: flex; flex-direction: column; gap: 3px; }
      #filters select, #filters input { font: inherit; font-size: 14px; padding: 6px 8px; border: 1px solid #d0d0d5; border-radius: 8px; background: #fff; }
      #filters input { width: 110px; }
      #filters button { font: inherit; font-weight: 600; padding: 8px 18px; border: none; border-radius: 8px; background: #e4002b; color: #fff; cursor: pointer; }
      #filters button:hover { background: #c40025; }
      #count { padding: 12px 24px 0; font-size: 13px; color: #86868b; }
      #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; padding: 16px 24px 40px; }
      .card { background: #fff; border-radius: 12px; overflow: hidden; border: 1px solid #ececf0; display: flex; flex-direction: column; }
      .card img { width: 100%; height: 190px; object-fit: cover; background: #eaeaef; }
      .card .body { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
      .card .price { font-size: 18px; font-weight: 700; }
      .card .price small { font-size: 12px; font-weight: 500; color: #86868b; }
      .card .title { font-size: 13px; color: #3a3a3c; line-height: 1.3; }
      .card .specs { font-size: 13px; color: #1d1d1f; display: flex; gap: 12px; margin-top: auto; }
      .card .loc { font-size: 12px; color: #86868b; }
      .card .agent { font-size: 11px; color: #a0a0a5; border-top: 1px solid #f0f0f2; padding-top: 8px; }
      .card a.view { font-size: 13px; font-weight: 600; color: #e4002b; text-decoration: none; }
      .tag { display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 2px 7px; border-radius: 6px; background: #f0f0f2; color: #86868b; align-self: flex-start; }
      .empty { padding: 40px 24px; color: #86868b; }
    </style>
  </head>
  <body>
    <header>
      <h1>propertyfinder</h1>
      <span style="font-size:13px;color:#86868b">agent portal</span>
      <span class="pulled" id="pulled"></span>
    </header>
    <div id="filters">
      <label>Purpose
        <select id="category">
          <option value="rent">Rent</option>
          <option value="buy">Buy</option>
        </select>
      </label>
      <label>Area
        <select id="area">
          <option value="">All areas</option>
          <option>Dubai Marina</option>
          <option>Downtown Dubai</option>
          <option>Business Bay</option>
        </select>
      </label>
      <label>Min beds
        <select id="min_beds">
          <option value="">Any</option>
          <option value="0">Studio+</option>
          <option value="1">1+</option>
          <option value="2">2+</option>
          <option value="3">3+</option>
        </select>
      </label>
      <label>Min price
        <input id="min_price" type="number" placeholder="AED" />
      </label>
      <label>Max price
        <input id="max_price" type="number" placeholder="AED" />
      </label>
      <label>Furnishing
        <select id="furnished">
          <option value="">Any</option>
          <option value="YES">Furnished</option>
          <option value="NO">Unfurnished</option>
        </select>
      </label>
      <button id="search">Search</button>
    </div>
    <div id="count"></div>
    <div id="grid"></div>
    <script src="properties.js"></script>
  </body>
</html>
